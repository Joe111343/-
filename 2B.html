<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>9軌 MIDI 合成器 + 採樣支援</title>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.27/build/Midi.js"></script>
<style>
  body { background:#111; color:#eee; font-family:sans-serif; text-align:center; }
  canvas { background:#000; display:block; margin:1em auto; border:1px solid #444; }
  input, button, select { font-size:1.1em; margin:0.5em; }
  .channel-controls { display:flex; flex-wrap:wrap; justify-content:center; margin:1em auto; max-width:800px; }
  .channel { border:1px solid #444; border-radius:8px; padding:0.5em; margin:0.3em; background:#222; width:180px; }
  .channel label { display:block; margin:0.2em 0; font-size:0.9em; }
</style>
</head>
<body>
<h1>9軌 MIDI 合成器 + 採樣支援</h1>
<input type="file" id="midiInput" accept=".mid" />
<button id="playBtn" disabled>▶ 播放</button>
<button id="stopBtn" disabled>■ 停止</button>
<canvas id="oscilloscope" width="640" height="120"></canvas>
<div class="channel-controls" id="channelControls"></div>
<script>
const MAX_CHANNELS = 9;
const waveTypes = ["square", "sawtooth", "triangle", "noise", "kick"];

let audioCtx, masterGain, analyser;
let customOscillators = [];
let gains = [];
let lfos = [], lfoGains = [];
let sustain = new Array(MAX_CHANNELS).fill(false);
let sustainNotes = new Array(MAX_CHANNELS).fill(null).map(() => new Set());
let volumeCC = new Array(MAX_CHANNELS).fill(1);
let modulationCC = new Array(MAX_CHANNELS).fill(0);
let currentFreq = new Array(MAX_CHANNELS).fill(null);
let channelWaveType = [
  "sawtooth", "sawtooth",      // 2鋸齒波
  "square", "square", "square", "square",  // 4方波
  "triangle", "triangle",      // 2三角波
  "kick"                      // 1採樣
];
let midiNotes = [];
let kickBuffer = null;

const canvas = document.getElementById("oscilloscope");
const ctx = canvas.getContext("2d");

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

async function loadKickSample() {
  const response = await fetch("https://cdn.jsdelivr.net/gh/nbrosowsky/kick-wav@main/kick.wav");
  const arrayBuffer = await response.arrayBuffer();
  kickBuffer = await audioCtx.decodeAudioData(arrayBuffer);
}

function setupAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.1;
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    masterGain.connect(analyser);
    analyser.connect(audioCtx.destination);

    for (let i = 0; i < MAX_CHANNELS; i++) {
      const osc = audioCtx.createOscillator();
      osc.type = waveTypes[0];
      osc.frequency.value = 0;
      osc.start();

      const gain = audioCtx.createGain();
      gain.gain.value = 0;

      const lfo = audioCtx.createOscillator();
      lfo.type = "sine";
      lfo.frequency.value = 5;
      lfo.start();

      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 0;
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);

      osc.connect(gain);
      gain.connect(masterGain);

      customOscillators.push({
        type: waveTypes[0],
        osc,
        noiseNode: null,
        gain,
        lfoGain
      });

      gains.push(gain);
      lfos.push(lfo);
      lfoGains.push(lfoGain);
    }
    loadKickSample();
  }
  audioCtx.resume();
}

function playNote(channel, midiNote, time, duration) {
  if (channel >= MAX_CHANNELS) return;
  const freq = midiToFreq(midiNote);
  currentFreq[channel] = freq;
  const modDepth = (modulationCC[channel] / 127) * 20;
  lfoGains[channel].gain.setValueAtTime(modDepth, time);

  const oscWrap = customOscillators[channel];
  const type = channelWaveType[channel];

  if (type === "kick" && kickBuffer) {
    const src = audioCtx.createBufferSource();
    src.buffer = kickBuffer;
    const gainNode = audioCtx.createGain();
    gainNode.gain.value = volumeCC[channel];
    src.connect(gainNode).connect(masterGain);
    src.start(time);
  } else if (type === "noise") {
    if (oscWrap.noiseNode) oscWrap.noiseNode.disconnect();
    const bufferSize = 4096;
    const noiseNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);
    noiseNode.onaudioprocess = e => {
      const out = e.outputBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) out[i] = Math.random() * 2 - 1;
    };
    noiseNode.connect(oscWrap.gain);
    oscWrap.noiseNode = noiseNode;
    oscWrap.gain.gain.setValueAtTime(volumeCC[channel], time);
    oscWrap.gain.gain.setTargetAtTime(0, time + duration, 0.05);
  } else {
    oscWrap.osc.type = type;
    oscWrap.osc.frequency.setValueAtTime(freq, time);
    oscWrap.gain.gain.setValueAtTime(volumeCC[channel], time);
    oscWrap.gain.gain.setTargetAtTime(0, time + duration, 0.05);
  }

  if (sustain[channel]) sustainNotes[channel].add(midiNote);
  else sustainNotes[channel].delete(midiNote);
}

function handleProgramChange(channel, programNumber) {
  if (channel >= MAX_CHANNELS) return;
  // 本版本不使用 programChange 自動設定波形，改用 UI 控制
}

function handleControlChange(channel, cc, value, time) {
  if (channel >= MAX_CHANNELS) return;
  switch(cc) {
    case 1: modulationCC[channel] = value; break;
    case 7:
      volumeCC[channel] = value / 127;
      gains[channel].gain.setValueAtTime(volumeCC[channel], time);
      const volLabel = document.getElementById(`volLabel${channel}`);
      if (volLabel) volLabel.textContent = `音量: ${Math.round(volumeCC[channel]*100)}%`;
      break;
    case 64:
      sustain[channel] = value >= 64;
      if (!sustain[channel]) {
        sustainNotes[channel].forEach(note => gains[channel].gain.setTargetAtTime(0, time, 0.05));
        sustainNotes[channel].clear();
      }
      break;
  }
}

let playStartTime = 0;
let scheduledIds = [];

document.getElementById("midiInput").addEventListener("change", async e => {
  if(e.target.files.length === 0) return;
  try {
    const file = e.target.files[0];
    const buffer = await file.arrayBuffer();
    const midi = new Midi(buffer);
    midiNotes = [];
    midi.tracks.forEach((track, i) => {
      track.notes.forEach(note => {
        // 若MIDI頻道超過9，會丟棄或映射成9通道內，這裡用 i%MAX_CHANNELS 保證不錯亂
        midiNotes.push({ type:"note", midi:note.midi, time:note.time, duration:note.duration, channel:note.channel ?? i % MAX_CHANNELS });
      });
      if(track.programChanges && Array.isArray(track.programChanges)) {
        track.programChanges.forEach(event => {
          midiNotes.push({ type:"programChange", channel:event.channel, programNumber:event.programNumber, time:event.time });
        });
      }
    });
    midiNotes.sort((a,b)=>a.time-b.time);
    document.getElementById("playBtn").disabled = midiNotes.length === 0;
  } catch(err) {
    alert("解析 MIDI 失敗: " + err.message);
  }
});

function stopAllSound() {
  customOscillators.forEach(oscWrap => {
    if (oscWrap.noiseNode) {
      oscWrap.noiseNode.disconnect();
      oscWrap.noiseNode = null;
    }
    oscWrap.gain.gain.cancelScheduledValues(audioCtx.currentTime);
    oscWrap.gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.01);
  });
}

function stopPlayback() {
  scheduledIds.forEach(id => clearTimeout(id));
  scheduledIds = [];
  stopAllSound();
  document.getElementById("playBtn").disabled = false;
  document.getElementById("stopBtn").disabled = true;
}

function playMIDI() {
  if (!midiNotes.length) return;
  setupAudio();
  if (audioCtx.state === "suspended") audioCtx.resume();
  stopPlayback();

  playStartTime = audioCtx.currentTime + 0.1;
  midiNotes.forEach(event => {
    const t = playStartTime + event.time;
    if (event.type === "note") {
      scheduledIds.push(setTimeout(() => playNote(event.channel, event.midi, t, event.duration), (t - audioCtx.currentTime) * 1000));
    } else if (event.type === "programChange") {
      scheduledIds.push(setTimeout(() => handleProgramChange(event.channel, event.programNumber), (t - audioCtx.currentTime) * 1000));
    }
  });

  document.getElementById("playBtn").disabled = true;
  document.getElementById("stopBtn").disabled = false;
  drawOscilloscope();
}

document.getElementById("playBtn").addEventListener("click", playMIDI);
document.getElementById("stopBtn").addEventListener("click", stopPlayback);

function drawOscilloscope() {
  const bufferLength = analyser.fftSize;
  const dataArray = new Uint8Array(bufferLength);
  function draw() {
    analyser.getByteTimeDomainData(dataArray);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#0f0";
    ctx.beginPath();
    const sliceWidth = canvas.width / bufferLength;
    let x = 0;
    for(let i = 0; i < bufferLength; i++) {
      const v = dataArray[i] / 128.0;
      const y = v * canvas.height / 2;
      if(i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
      x += sliceWidth;
    }
    ctx.lineTo(canvas.width, canvas.height / 2);
    ctx.stroke();
    if (!document.getElementById("playBtn").disabled) return;
    requestAnimationFrame(draw);
  }
  draw();
}

function createChannelControls() {
  const container = document.getElementById("channelControls");
  for (let i = 0; i < MAX_CHANNELS; i++) {
    const div = document.createElement("div");
    div.className = "channel";
    const label = document.createElement("label");
    label.textContent = `Ch ${i}`;
    div.appendChild(label);

    const select = document.createElement("select");
    waveTypes.forEach(type => {
      const opt = document.createElement("option");
      opt.value = type;
      opt.textContent = type;
      select.appendChild(opt);
    });
    select.value = channelWaveType[i];
    select.addEventListener("change", () => {
      channelWaveType[i] = select.value;
    });
    div.appendChild(select);

    const vol = document.createElement("label");
    vol.id = `volLabel${i}`;
    vol.textContent = `音量: 100%`;
    div.appendChild(vol);

    container.appendChild(div);
  }
}
createChannelControls();
</script>
</body>
</html>
