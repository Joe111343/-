<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多人3D骨架動捕（多人版）</title>
<style>
  body { margin:0; overflow:hidden; background:#111; }
  #ui { position:absolute; top:10px; left:10px; color:white; z-index:10; }
  select, input, button { margin:2px; }
</style>
</head>
<body>
<div id="ui">
  <select id="mode">
    <option value="single">單人模式</option>
    <option value="multi">多人模式</option>
  </select>
  <input id="peerIdInput" placeholder="輸入對方ID"/>
  <button id="connectBtn">連線</button>
  <div id="myIdDisplay"></div>
</div>
<video id="video" autoplay playsinline style="display:none;"></video>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
const video = document.getElementById('video');
let mode = 'single';
const modeSelect = document.getElementById('mode');
const peerIdInput = document.getElementById('peerIdInput');
const connectBtn = document.getElementById('connectBtn');
const myIdDisplay = document.getElementById('myIdDisplay');
modeSelect.addEventListener('change', ()=> mode = modeSelect.value);

// -------------------- Three.js 3D --------------------
const scene = new THREE.Scene();
scene.background = null;
const camera3D = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight,0.1,1000);
camera3D.position.set(0,0,15);
const renderer = new THREE.WebGLRenderer({alpha:true, antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// 光源
const ambientLight = new THREE.AmbientLight(0xffffff,0.5);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff,1);
dirLight.position.set(10,10,10);
dirLight.castShadow = true;
scene.add(dirLight);

// -------------------- MediaPipe Pose --------------------
const pose = new Pose({locateFile: (file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
pose.setOptions({modelComplexity:2, smoothLandmarks:false, enableSegmentation:false});
let lastLandmarks = null;

// 2D/3D 標記轉 THREE.Vector3
function landmarkToVector3Force(p, last){
  if(p) return new THREE.Vector3((p.x-0.5)*10, -(p.y-0.5)*10, -p.z*10);
  else return last ? last.clone() : new THREE.Vector3(0,0,0);
}

// -------------------- 骨架 --------------------
function createSkeleton(color=0xff0000){
  const group = new THREE.Group();
  const joints = [];
  const bones = [];
  for(let i=0;i<33;i++){
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.2,8,8),
      new THREE.MeshPhongMaterial({color, transparent:true, opacity:1})
    );
    sphere.castShadow=true; sphere.receiveShadow=true;
    group.add(sphere);
    joints.push(sphere);
  }
  const boneIndices = [
    [11,13],[13,15],[15,17],[17,19],[19,21],
    [12,14],[14,16],[16,18],[18,20],[20,22],
    [11,12],[11,23],[12,24],[23,24],[23,25],[24,26],[25,27],[26,28],[27,29],[28,30],[29,31],[30,32],[31,33],[32,34]
  ];
  boneIndices.forEach(b=>{
    const mat = new THREE.MeshPhongMaterial({color, transparent:true, opacity:1});
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,1,6), mat);
    cyl.castShadow=true; cyl.receiveShadow=true;
    group.add(cyl);
    bones.push({mesh:cyl, indices:b});
  });
  return {group,joints,bones};
}

const localSkeleton = createSkeleton(0x00ffff);
scene.add(localSkeleton.group);
let remoteUsers={};

// -------------------- 更新骨架（永遠連線 + 正確對齊骨頭） --------------------
function updateSkeletonForceConnect(skeleton, landmarks){
  skeleton.joints.forEach((joint,i)=>{
    const v = landmarkToVector3Force(landmarks[i], joint.position);
    joint.position.copy(v);
  });
  skeleton.bones.forEach(b=>{
    const a = skeleton.joints[b.indices[0]];
    const c = skeleton.joints[b.indices[1]];
    if(a && c){
      const dir = new THREE.Vector3().subVectors(c.position,a.position);
      const mid = new THREE.Vector3().addVectors(a.position,c.position).multiplyScalar(0.5);
      b.mesh.position.copy(mid);
      b.mesh.scale.set(1, dir.length(), 1);
      b.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
    }
  });
}

// 遠端骨架
function updateRemoteSkeletonForceConnect(remote, landmarks){
  if(landmarks) remote.lastLandmarks = landmarks;
  const smooth = [];
  for(let i=0;i<33;i++){
    const pNew = landmarks && landmarks[i]?landmarks[i]:null;
    const pOld = remote.lastLandmarks[i] || {x:0,y:0,z:0};
    smooth[i] = pNew || pOld;
  }
  updateSkeletonForceConnect(remote.skeleton, smooth);
}

// -------------------- MediaPipe 回傳 --------------------
pose.onResults(results=>{
  if(results.poseLandmarks){
    updateSkeletonForceConnect(localSkeleton, results.poseLandmarks);
    lastLandmarks = results.poseLandmarks.map((p,i)=>p || lastLandmarks[i]);
    if(mode==='multi' && conn && conn.open){
      conn.send(JSON.stringify({id:myId, landmarks:results.poseLandmarks.map(p=>p?p:{x:0,y:0,z:0})}));
    }
  }
});

// -------------------- 攝影機 --------------------
const cameraMP = new Camera(video,{onFrame: async()=>{await pose.send({image:video});}, width:640, height:480});
cameraMP.start();

// -------------------- PeerJS --------------------
let peer, conn;
const myId = Math.floor(Math.random()*10000).toString();
myIdDisplay.innerText = `我的ID: ${myId}`;

connectBtn.addEventListener('click', ()=>{
  if(mode!=='multi') return;
  if(!peer){
    peer = new Peer(myId);
    peer.on('connection', c=>{
      c.on('data', handleRemoteData);
    });
  }
  conn = peer.connect(peerIdInput.value);
  conn.on('open', ()=> console.log('連線成功'));
  conn.on('data', handleRemoteData);
});

function handleRemoteData(data){
  const obj = JSON.parse(data);
  const id = obj.id;
  if(!remoteUsers[id]){
    const skeleton = createSkeleton(Math.random()*0xffffff);
    scene.add(skeleton.group);
    remoteUsers[id] = {skeleton, lastLandmarks: obj.landmarks};
  }
  updateRemoteSkeletonForceConnect(remoteUsers[id], obj.landmarks);
}

// -------------------- 渲染迴圈 --------------------
function animate(){
  requestAnimationFrame(animate);
  Object.values(remoteUsers).forEach(r=>updateRemoteSkeletonForceConnect(r, null));
  renderer.render(scene,camera3D);
}

animate();

window.addEventListener('resize', ()=>{
  camera3D.aspect = window.innerWidth/window.innerHeight;
  camera3D.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
